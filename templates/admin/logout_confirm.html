{% extends "base_admin.html" %}
{% block page_title %}Confirm Logout{% endblock %}
{% block content %}
<div class="panel text-center mx-auto" style="max-width:420px;">
  <h5 class="mb-3">Are you sure you want to logout?</h5>
  <form method="post" class="d-flex justify-content-center gap-2">
    <button class="btn btn-primary" type="submit">YES</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('admin.dashboard') }}">NO</a>
  </form>
</div>
{% endblock %}
